pipelines:
  - id: smart-todo-digest
    factory: digest
    agent: "agent:make_agent"
    thread_id: smart-todo-digest
    message: |
      Good morning! Compile and send the daily todo digest.
      1. Call list_todos(status='active') to get open items.
      2. Call list_todos(status='done') to get items completed since yesterday.
      Compose a single styled HTML email with two sections:
      '✅ Completed' (done items) and '📋 Still open' (active items, grouped by priority).
      Return the HTML — do not call any send or email tools.
    trigger:
      type: cron
      default_schedule: "0 8 * * 1-5"
    output:
      type: email
      subject_prefix: "📋 Smart Todo Digest"
    require_buffer: false
