pipelines:
  - id: newsletter-digest
    factory: newsletter
    agent: "agent:make_agent"
    thread_id: newsletter-digest
    message: |
      It's time to send the newsletter digest.

      You have been given a list of items collected since the last digest.
      These may include RSS articles AND podcast transcript excerpts — items
      with a "transcript_excerpt" field are from podcasts.

      Select the most significant and diverse items, avoiding duplicates from
      prior runs. Compose a styled HTML newsletter using the newsletter_curation
      skill. Podcast items belong in the Podcasts section.

      Your full output will be delivered automatically — do not call any send
      or email tools.
    trigger:
      type: cron
      default_schedule: "*/2 * * * *"
    data:
      - type: rss
        default_sources:
          - "https://arxiv.org/rss/cs.AI"
          - "https://huggingface.co/blog/feed.xml"
        default_keywords:
          - "agent"
          - "agentic"
          - "large language model"
          - "LLM"
          - "RAG"
          - "reasoning"

    
    output:
      type: email
      subject_prefix: "CUGA Newsletter"
      to: "anupama.murthi@gmail.com"
    require_buffer: true
