# Server Monitor — cuga++ pipeline configuration
#
# Registers the "briefing" pipeline factory with CugaHost.
# CugaHost loads this at startup and makes it available to
# CugaHostClient.start_runtime("server-briefing", "briefing", {...}).
#
# The "briefing" factory wires:
#   CronChannel (schedule from runtime config)
#   → CugaAgent (server health briefing)
#   → EmailChannel (if SMTP configured) or LogChannel

version: "1"

# pipelines must be a list; each entry needs an "id" key.
# agent: "module:function" — resolved relative to this file's directory.
# Default agent ref is "agent:make_agent" (looks for make_agent in agent.py).

pipelines:
  - id:        briefing
    agent:     agent:make_agent
    thread_id: server-briefing

    trigger:
      type:             cron
      default_schedule: "0 8 * * *"    # 8am daily

    output:
      type:           email
      subject_prefix: "☀️ Server Briefing"

    message: >
      Good morning! Please give me the daily server health briefing.
      Check current metrics, verify any running services you know about,
      and summarise the overall health of the system.
