pipelines:
  - id: newsletter-digest
    factory: newsletter
    agent: "agent:make_agent"
    thread_id: newsletter-digest
    message: |
      It's time to send the newsletter digest.

      You have been given a list of items collected since the last digest.
      These may include RSS articles AND podcast transcript excerpts — items
      with a "transcript_excerpt" field are from podcasts.

      Select the most significant and diverse items, avoiding duplicates from
      prior runs. Compose a styled HTML newsletter using the newsletter_curation
      skill. Podcast items belong in the Podcasts section.

      Your full output will be delivered automatically — do not call any send
      or email tools.
    trigger:
      type: cron
      default_schedule: "*/2 * * * *"
    data:
      - type: rss
        default_sources:
          - "https://arxiv.org/rss/cs.AI"
          - "https://huggingface.co/blog/feed.xml"
        default_keywords:
          - "agent"
          - "agentic"
          - "large language model"
          - "LLM"
          - "RAG"
          - "reasoning"

      - type: podcast
        default_sources:
          - "https://changelog.com/practicalai/feed"
          - "https://www.latent.space/feed/podcast"
        default_keywords:
          - "agent"
          - "agentic"
          - "AI agents"
          - "LLM"
        max_duration_minutes: 10        # skip episodes over 90 min (saves download time)
        transcript_chars: 2000          # excerpt length pushed to buffer
        whisper_model: tiny             # use "base" or "small" for better accuracy
        podcast_poll_minutes: 60        # poll podcast feeds every hour
        chroma_persist_dir: .cuga/chroma  # full transcripts indexed here
        chroma_collection: podcasts       # ChromaDB collection name

    output:
      type: email
      subject_prefix: "CUGA Newsletter"
      to: "anupama.murthi@gmail.com"
    require_buffer: true
